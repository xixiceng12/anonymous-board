<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>匿名留言板</title>
  <style>
    body { font-family: sans-serif; background: #121212; color: #fff; max-width: 600px; margin: 40px auto; padding: 20px; }
    .card, .post { background: #1e1e1e; padding: 15px; border-radius: 8px; margin-bottom: 15px; border: 1px solid #333; }
    input, textarea, button { width: 100%; padding: 10px; margin-top: 8px; background: #2a2a2a; border: 1px solid #444; color: #fff; border-radius: 4px; box-sizing: border-box; }
    button { background: #4caf50; font-weight: bold; cursor: pointer; border: none; }
    button:hover { background: #45a049; }
    .post-header { display: flex; justify-content: space-between; font-size: 0.8em; color: #aaa; margin-bottom: 5px; }
    .name { color: #81c784; font-weight: bold; }
  </style>
</head>
<body>
  <h1>💬 匿名留言板</h1>

  <div class="card">
    <input type="text" id="nickname" placeholder="你的暱稱 (選填)">
    <textarea id="content" rows="3" placeholder="說點什麼吧..."></textarea>
    <button onclick="sendPost()">發布留言</button>
  </div>

  <div id="postsList">載入中...</div>

  <script>
    loadPosts();

    async function loadPosts() {
      const res = await fetch('/api/posts');
      const posts = await res.json();
      const list = document.getElementById('postsList');
      
      if(posts.length === 0) {
        list.innerHTML = '<p style="text-align:center;color:#777">目前沒有留言</p>';
        return;
      }

      list.innerHTML = posts.map(p => `
        <div class="post">
          <div class="post-header">
            <span class="name">${escapeHtml(p.nickname)}</span>
            <span>${new Date(p.createdAt).toLocaleString()}</span>
          </div>
          <div>${escapeHtml(p.content)}</div>
        </div>
      `).join('');
    }

    async function sendPost() {
      const nickname = document.getElementById('nickname').value;
      const content = document.getElementById('content').value;

      if (!content.trim()) {
        alert('請輸入留言內容！');
        return;
      }

      await fetch('/api/posts', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ nickname, content })
      });

      document.getElementById('content').value = '';
      loadPosts();
    }

    function escapeHtml(str) {
      return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }
  </script>
</body>
</html>
